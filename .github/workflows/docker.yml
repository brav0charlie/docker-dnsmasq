name: Build and Publish Docker Image (Release + Manual)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v2.91-r0). REQUIRED for manual runs."
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: brav0charlie/docker-dnsmasq

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: 1
      BUILDKIT_PROGRESS: plain

    steps:
      - name: Checkout repository (correct ref)
        uses: actions/checkout@v4
        with:
          # On manual runs, build the tag the user typed.
          # On release runs, build the release ref.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tag to publish
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
            if [[ -z "${TAG}" ]]; then
              echo "ERROR: Manual runs require an explicit 'tag' input."
              exit 1
            fi
          else
            # release.published
            TAG="${GITHUB_REF_NAME}"
          fi

          # Strip accidental refs/tags/ prefix if someone pastes it.
          TAG="${TAG#refs/tags/}"

          if [[ -z "${TAG}" ]]; then
            echo "ERROR: Tag resolved to empty value."
            exit 1
          fi

          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Publishing tag: ${TAG}"

      - name: Build and push Docker image (version + latest)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
