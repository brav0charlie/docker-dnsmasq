name: Build and Publish Docker Image (Release + Manual)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0). REQUIRED for manual runs."
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: brav0charlie/docker-dnsmasq

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tag to publish
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          EVENT="${{ github.event_name }}"
          TAG_INPUT="${{ github.event.inputs.tag }}"

          if [[ "${EVENT}" == "workflow_dispatch" ]]; then
            if [[ -z "${TAG_INPUT}" ]]; then
              echo "ERROR: Manual runs require an explicit 'tag' input."
              exit 1
            fi
            TAG="${TAG_INPUT}"
          else
            # release.published
            TAG="${GITHUB_REF_NAME}"
          fi

          # Strip accidental refs/tags/ prefix
          TAG="${TAG#refs/tags/}"

          if [[ -z "${TAG}" ]]; then
            echo "ERROR: Tag resolved to empty value."
            exit 1
          fi

          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Publishing tag: ${TAG}"

      - name: Build and push Docker image (version + latest)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
